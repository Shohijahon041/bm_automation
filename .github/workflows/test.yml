name: CI — pytest

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      # Action'lar tag emas, commit SHA bilan qulflangan: tag ko'chirilsa ham
      # (`v4` qayta yozilsa) CI begona kod ishga tushirmaydi.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Python 3.12 sozlash
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwright brauzerlari
        run: |
          python -m playwright install chromium --with-deps

      - name: Testlar (pytest tests -q)
        env:
          BM_DB_DRIVER: sqlite
          BM_TEST_MODE: "1"
        run: pytest tests -q